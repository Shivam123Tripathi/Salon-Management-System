// settings.gradle tells Gradle which modules (sub-projects) to include in the build.
// It also tells Gradle WHERE to download dependencies from.

pluginManagement {
    repositories {
        google()           // Google's Maven repo (Android SDK, Material Design)
        mavenCentral()     // Main public repo (Retrofit, Gson, etc.)
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SalonApp"
include ':app'
