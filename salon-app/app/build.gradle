// App-level build.gradle — THIS is where all the action happens.
// It defines: which Android SDK to target, what libraries to use, and how to build the APK.

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.salon.app'       // Unique package name for your app
    compileSdk 34                    // SDK version to COMPILE against (latest stable)

    defaultConfig {
        applicationId "com.salon.app"   // Unique ID on Google Play Store
        minSdk 26                        // Minimum Android version (8.0 Oreo)
        targetSdk 34                     // SDK version you've TESTED against
        versionCode 1                    // Internal version number (increment for updates)
        versionName "1.0.0"              // User-facing version string

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false     // Set to true for production (shrinks APK)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // --- CORE ANDROID ---
    implementation 'androidx.appcompat:appcompat:1.6.1'           // Backward-compatible UI components
    implementation 'com.google.android.material:material:1.11.0'  // Material Design 3 (buttons, cards, etc.)
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Flexible layout system
    implementation 'androidx.recyclerview:recyclerview:1.3.2'      // Scrollable lists
    implementation 'androidx.cardview:cardview:1.0.0'              // Card UI elements
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0' // Pull-to-refresh

    // --- NETWORKING ---
    // Retrofit: Turns your API interface into HTTP calls
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    // Gson Converter: Automatically converts JSON ↔ Java objects
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // OkHttp Logging: Shows HTTP requests/responses in Logcat (for debugging)
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // --- TESTING ---
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
