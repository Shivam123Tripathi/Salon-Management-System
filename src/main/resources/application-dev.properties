# =============================================================
# DEV PROFILE — application-dev.properties
# =============================================================
# Activated when: spring.profiles.active=dev (the default)
#
# PURPOSE: Makes local development EASY.
# - Hibernate auto-creates/updates tables (no need to write SQL for every change)
# - DEBUG logs show SQL queries so you can see what's happening
# - SQL is formatted for readability
#
# IMPORTANT: These settings OVERRIDE the base application.properties.
# Only the settings listed here are overridden; everything else comes from base.
# =============================================================

# --- HIBERNATE ---
# "update": Hibernate compares your @Entity classes with the database schema
# and automatically adds new tables/columns. NEVER drops data.
# SAFE for development, UNSAFE for production (explained in prod profile).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- FLYWAY ---
# In dev, we DISABLE Flyway so that Hibernate manages the schema.
# This avoids conflicts: if both Flyway AND Hibernate try to create tables,
# you get errors. Pick ONE per environment.
spring.flyway.enabled=false

# --- LOGGING ---
# DEBUG in dev lets you see:
# - Every SQL query Hibernate runs
# - Spring Security decisions (why a request was blocked/allowed)
# - Your own debug() log statements
logging.level.com.salon=DEBUG
logging.level.org.springframework.security=DEBUG
