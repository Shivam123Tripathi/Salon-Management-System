# =============================================================
# APPLICATION CONFIGURATION (BASE / SHARED)
# =============================================================
# This is the BASE configuration file. Settings here apply to ALL profiles.
# Profile-specific overrides live in:
#   application-dev.properties   (for local development)
#   application-prod.properties  (for production deployment)
#
# HOW PROFILES WORK:
# Spring Boot loads THIS file first, then OVERRIDES with the active profile.
# Set the active profile via:
#   - Command line: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   - Environment variable: SPRING_PROFILES_ACTIVE=dev
#   - Below (default): spring.profiles.active=dev
# =============================================================

# --- ACTIVE PROFILE ---
# Default to "dev" for local development. Change to "prod" for deployment.
spring.profiles.active=dev

# --- SERVER ---
server.port=8080

# --- DATABASE CONNECTION ---
# ${DB_USERNAME} and ${DB_PASSWORD} are ENVIRONMENT VARIABLES.
# Spring reads them from your OS environment at startup.
# If not set, Spring throws an error — this is INTENTIONAL for security.
# See explanation below on how to set them.
spring.datasource.url=jdbc:mysql://localhost:3306/salon_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
# ddl-auto is set PER PROFILE (dev=update, prod=validate). See profile files.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- FLYWAY DATABASE MIGRATION ---
# Flyway runs SQL migration scripts in src/main/resources/db/migration/
# It tracks which scripts have been applied in a table called "flyway_schema_history"
# Scripts are versioned: V1__init.sql, V2__add_column.sql, etc.
# Flyway runs BEFORE Hibernate, so the schema exists before validation.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


# --- JWT CONFIGURATION ---
# ${JWT_SECRET} is an ENVIRONMENT VARIABLE — NEVER hardcode secrets!
# jwt.expiration: 86400000 ms = 24 hours
jwt.secret=${JWT_SECRET:dev-jwt-secret-change-me}
jwt.expiration=86400000

# --- SWAGGER / OPENAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- LOGGING ---
# Base level is INFO (safe for production). Dev profile overrides to DEBUG.
# WHY NOT DEBUG IN PRODUCTION?
#   1. DEBUG logs contain SENSITIVE data (SQL queries, request bodies, tokens)
#   2. They generate MASSIVE log files (GBs per day on a busy server)
#   3. They SLOW DOWN the app (I/O overhead of writing logs)
#   4. They make it HARDER to find real errors in a sea of debug noise
logging.level.com.salon=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

otp.twilio.enabled=${OTP_TWILIO_ENABLED:false}
otp.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
otp.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
otp.twilio.from-number=${TWILIO_FROM_NUMBER:}
auth.require-phone-otp=${AUTH_REQUIRE_PHONE_OTP:false}

# --- RAZORPAY PAYMENT GATEWAY ---
razorpay.key.id=${RAZORPAY_KEY_ID:test_key}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:test_secret}
razorpay.enabled=${RAZORPAY_ENABLED:false}

# --- EMAIL CONFIGURATION ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from.name=Salon Management System
mail.from.address=${MAIL_USERNAME:noreply@salon.com}

# --- FIREBASE CONFIGURATION ---
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.config.path=${FIREBASE_CONFIG_PATH:}

# --- FILE UPLOAD ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload.dir=${FILE_UPLOAD_DIR:./uploads}

