# =============================================================
# PROD PROFILE — application-prod.properties
# =============================================================
# Activated when: spring.profiles.active=prod
#   Command: mvn spring-boot:run -Dspring-boot.run.profiles=prod
#   Or set env var: SPRING_PROFILES_ACTIVE=prod
#
# PURPOSE: Locks down the app for PRODUCTION deployment.
# =============================================================

# --- HIBERNATE ---
# "validate": Hibernate ONLY CHECKS that your @Entity classes match the database.
# It does NOT create, alter, or drop any tables.
#
# WHY IS ddl-auto=update DANGEROUS IN PRODUCTION?
#   1. It can ADD columns you didn't intend (from a dev branch entity change)
#   2. It NEVER DROPS unused columns (schema bloat over time)
#   3. It can LOCK large tables during ALTER TABLE (causes downtime!)
#   4. You have NO RECORD of what changed and when (no audit trail)
#   5. If two app instances start simultaneously, they can conflict
#
# In production, Flyway handles ALL schema changes via versioned SQL scripts.
# This gives you: version control, rollback capability, and a clear audit trail.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- FLYWAY ---
# In prod, Flyway is ENABLED. It runs migration scripts in order:
# V1__init.sql → V2__add_feature.sql → V3__fix_column.sql
# Each script runs EXACTLY ONCE. Flyway tracks which have been applied.
spring.flyway.enabled=true

# --- LOGGING ---
# INFO only — no SQL queries, no security debug, no noise.
# Only meaningful events: app start, errors, warnings.
logging.level.com.salon=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# --- SWAGGER ---
# Disable Swagger UI in production (API docs should not be public)
springdoc.swagger-ui.enabled=false
